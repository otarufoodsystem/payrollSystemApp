<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>給与管理システム</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f6f9; font-family: 'Helvetica Neue', Arial, sans-serif; }
    .navbar { background-color: #343a40; color: #fff; }
    .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; }
    .tab-btn { padding: 10px 20px; font-weight: bold; border: none; background: none; color: #6c757d; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #007bff; border-bottom: 3px solid #007bff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; color: #007bff; text-align: center; }
    #protection-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9990; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
  </style>
</head>
<body oninput="handleUserActivity()" onclick="handleUserActivity()" onkeypress="handleUserActivity()">

  <div id="loading" style="display: none;">🔄 処理中...</div>

  <div id="protection-overlay" style="display: none;">認証を確認しています...</div>

  <div id="login-screen" class="container mt-5" style="display: none; max-width: 400px;">
    <div class="card p-4">
      <h3 class="text-center mb-4">給与管理システム</h3>
      <div id="login-err-msg" class="alert alert-danger" style="display: none;">ユーザー名またはパスワードが違います</div>
      <div class="form-group">
        <label for="login-user">ユーザー名</label>
        <input type="text" id="login-user" class="form-control">
      </div>
      <div class="form-group">
        <label for="login-pass">パスワード</label>
        <input type="password" id="login-pass" class="form-control">
      </div>
      <button class="btn btn-primary btn-block font-weight-bold" onclick="executeManualLogin()">ログイン</button>
      <div class="text-center mt-3 text-muted" style="font-size: 0.8rem;">Version: <span id="app-version">-</span></div>
    </div>
  </div>

  <div id="main-app" class="container-fluid mt-3" style="display: none;">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded">
      <span class="navbar-brand font-weight-bold">💰 給与管理システム</span>
      <div class="ml-auto text-white-50 mr-3" style="font-size: 0.9rem;">
        ユーザー: <span id="current-user-display" class="text-white font-weight-bold"></span>
      </div>
      <button class="btn btn-outline-light btn-sm" onclick="triggerTimeout()">ログアウト</button>
    </nav>

    <!-- タブ切り替えボタン部 -->
    <div class="d-flex border-bottom mb-4 bg-white rounded p-1 shadow-sm">
      <button id="tab-salary-btn" class="tab-btn active" onclick="switchTab('salary')">💰 給与計算メニュー</button>
      <button id="tab-transfer-btn" class="tab-btn" onclick="switchTab('transfer')">🏦 給与振込メニュー</button>
    </div>
    
    <div id="tab-salary" class="tab-content active">
      <div class="card p-4 mb-4">
        <h5 class="font-weight-bold mb-3">勤怠データの呼び出し・給与計算</h5>
        
        <div class="form-row">
          <div class="col-md-4 mb-3">
            <label for="salary-month" class="font-weight-bold">対象月度 <span class="text-danger">*</span></label>
            <select id="salary-month" class="form-control"></select>
          </div>
          
          <div class="col-md-4 mb-3">
            <label for="salary-store" class="font-weight-bold">対象店舗 <span class="text-danger">*</span></label>
            <select id="salary-store" class="form-control">
              <option value="">-- 店舗を選択してください（必須） --</option>
            </select>
          </div>
          
          <div class="col-md-4 mb-3">
            <label for="salary-name" class="font-weight-bold">個人名（任意）</label>
            <select id="salary-name" class="form-control">
              <option value="ALL">すべてのスタッフ (店舗全員)</option>
            </select>
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-2">
          <button type="button" id="btn-fetch" class="btn btn-primary font-weight-bold mr-2 mb-2 flex-fill" onclick="fetchAttendanceForSalary()">
            🔄 勤怠データ取得
          </button>
          <button type="button" id="btn-payslip" class="btn btn-success font-weight-bold mr-2 mb-2 flex-fill" onclick="generateStaffPayslips()">
            📄 給与明細作成
          </button>
          <button type="button" id="btn-summary" class="btn btn-info font-weight-bold mb-2 flex-fill" onclick="handleCreateSummaryList()">
            📊 給与明細一覧作成
          </button>
        </div>

      </div>
      <div id="salary-result-area" class="card p-4">
        <div class="text-center text-muted">
          勤怠データを取得すると、ここに給与計算対象の一覧が表示されます。
        </div>
      </div>
    </div>
    
    <!-- タブコンテンツ：給与振込メニュー -->
    <div id="tab-transfer" class="tab-content">
      <div class="card p-4 mb-4">
        <h5 class="font-weight-bold mb-3">🏦 給与振込データ参照・全銀ファイル出力</h5>
        
        <div class="form-row">
          <div class="col-md-4 mb-3">
            <label for="transfer-month" class="font-weight-bold">対象月度 <span class="text-danger">*</span></label>
            <select id="transfer-month" class="form-control" onchange="loadTransferStaffList()"></select>
          </div>
          
          <div class="col-md-4 mb-3">
            <label for="transfer-company" class="font-weight-bold">会社名 <span class="text-danger">*</span></label>
            <select id="transfer-company" class="form-control" onchange="loadTransferStaffList()">
              <option value="">-- 会社を選択してください --</option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label for="transfer-date" class="font-weight-bold">振込指定日</label>
            <input type="date" id="transfer-date" class="form-control">
          </div>
        </div>
      </div>
    
      <!-- 下部：スタッフ一覧表示エリア -->
      <div id="transfer-result-area" class="card p-4">
        <div class="text-center text-muted">
          対象月度および会社名を選択すると、ここにスタッフ一覧・振込金額が表示されます。
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwcBwOULm3izF0LJxS_C6XYgTfUydIJ2ERprGmMnKLbzxZcDNvaajrYtahgYjPESiom/exec";
    const APP_VERSION = "1.3.11";
    const TEN_MINUTES = 10 * 60 * 1000;
    const SALARY_SPREADSHEET_ID = "1_BACpUP-ReKQQV2ywDm7nvU25Y8eYxrPfYLW8xxfd60"; 

    let currentUsername = "";
    let currentPassword = "";
    let timeoutTimer = null;
    let globalStaffList = [];
    let globalStoreList = [];

    const lastAuthTime = localStorage.getItem("admin_last_auth_time") || "0";
    window.addEventListener("DOMContentLoaded", runAuthentication);

    async function runAuthentication() {
      if (document.getElementById("app-version")) document.getElementById("app-version").innerText = APP_VERSION;

      const overlay = document.getElementById("protection-overlay");
      const loginScreen = document.getElementById("login-screen");
      const mainApp = document.getElementById("main-app");
      const now = Date.now();
  
      if (now - parseInt(lastAuthTime, 10) > TEN_MINUTES) {
        clearAuthStorage();
      }
      
      const savedUser = localStorage.getItem("admin_saved_username") || "";
      const savedPass = localStorage.getItem("admin_saved_password") || "";
      
      if (savedUser && savedPass) {
        if (loginScreen) loginScreen.style.display = "none";
        if (overlay) overlay.style.display = "flex";
        
        showLoading(true);
        try {
          const response = await fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "checkAuth", username: savedUser, password: savedPass, appVersion: APP_VERSION })
          });
          const resData = await response.json(); 
          if (resData.success) {
            currentUsername = savedUser;
            currentPassword = savedPass;
            localStorage.setItem("admin_last_auth_time", Date.now().toString());
            document.getElementById("current-user-display").innerText = currentUsername;
            
            await loadStoreList();
            await loadStaffList();
            
            if (overlay) overlay.style.display = "none";
            if (mainApp) mainApp.style.display = "block";
            
            initSalaryForm();
            initTransferForm();
            showLoading(false);
            resetTimeoutTimer();
            return;
          } else {
            alert("【認証不承認】保存されたパスワードが違います。ストレージをクリアします。理由: " + resData.error);
            clearAuthStorage();
          }
        } catch (e) {
          if (overlay) overlay.innerText = "通信エラーが発生しました。リロードしてください。";
          showLoading(false);
          return;
        }
      }
  
      if (overlay) overlay.style.display = "none";
      if (loginScreen) loginScreen.style.display = "flex";
      if (mainApp) mainApp.style.display = "none";
      showLoading(false);
    }

    async function executeManualLogin() {
      const user = document.getElementById("login-user").value.trim();
      const pass = document.getElementById("login-pass").value.trim();
      if(!user || !pass) { alert("ユーザー名とパスワードを入力してください。"); return; }

      showLoading(true);
      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "checkAuth", username: user, password: pass, appVersion: APP_VERSION })
        });
        const resData = await response.json();
        showLoading(false);
        if(resData.success) {
          localStorage.setItem("admin_saved_username", user);
          localStorage.setItem("admin_saved_password", pass);
          localStorage.setItem("admin_last_auth_time", Date.now().toString());
          document.getElementById("login-err-msg").style.display = "none";
          location.reload();
        } else {
          alert("【手動ログイン失敗】理由: " + (resData.error || "ユーザー名またはパスワードが違います。"));
          document.getElementById("login-err-msg").style.display = "block";
        }
      } catch(e) {
        showLoading(false);
        alert("【手動ログイン・通信エラー】\nエラー内容: " + e.message);
      }
    }
  
    function resetTimeoutTimer() {
      if (timeoutTimer) clearTimeout(timeoutTimer);
      if (currentUsername && currentPassword) {
        localStorage.setItem("admin_last_auth_time", Date.now().toString());
        timeoutTimer = setTimeout(triggerTimeout, TEN_MINUTES);
      }
    }
  
    function triggerTimeout() {
      if (timeoutTimer) clearTimeout(timeoutTimer);
      clearAuthStorage();
      currentUsername = "";
      currentPassword = "";
      location.reload();
    }
  
    function clearAuthStorage() {
      localStorage.removeItem("admin_saved_username");
      localStorage.removeItem("admin_saved_password");
      localStorage.removeItem("admin_last_auth_time");
    }

    function handleUserActivity() {
      if (currentUsername && currentPassword) {
        resetTimeoutTimer();
      }
    }
  
    function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }

    function switchTab(type) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if(document.getElementById(`tab-${type}-btn`)) document.getElementById(`tab-${type}-btn`).classList.add('active');
      if(document.getElementById(`tab-${type}`)) document.getElementById(`tab-${type}`).classList.add('active');
      if (type === 'transfer') {
        const transferMonthSelect = document.getElementById("transfer-month");
        if (transferMonthSelect && transferMonthSelect.options.length === 0) {
          initTransferForm();
        }
      }
    }

    function getStatusBadgeClass(status) {
      if (!status) return "badge badge-secondary status-badge";
      
      if (status === "勤怠データエラー") {
        return "badge badge-danger status-badge btn-status-click";
      } else if (status === "勤怠データワーニング" || status.indexOf("要確認") !== -1) {
        return "badge badge-warning status-badge btn-status-click";
      } else if (status === "給与明細作成済") {
        return "badge badge-primary status-badge";
      } else if (status === "勤怠データ取得済") {
        return "badge badge-success status-badge";
      }
      return "badge badge-secondary status-badge";
    }

    let globalAlertLogs = {};
    
    function showAttendanceAlertDetails(store, staffName) {
      const key = `${store}_${staffName}`;
      const alerts = globalAlertLogs[key];
    
      if (!alerts || alerts.length === 0) {
        alert("該当の警告・エラー内容はありません。");
        return;
      }
    
      const alertMessage = `【${staffName} 様 勤怠チェック結果】\n\n` + alerts.join("\n");
      alert(alertMessage);
    }
    
    async function callGas(action, data = null) {
      return await callGasWithRetry(action, data, 3, 1500);
    }

    async function callGasWithRetry(action, data = null, retries = 3, interval = 1500) {
      const savedUser = localStorage.getItem("admin_saved_username") || "";
      const savedPass = localStorage.getItem("admin_saved_password") || "";
      const payload = { action: action, username: savedUser, password: savedPass };
      if (data !== null) payload.data = data;

      for (let attempt = 1; attempt <= retries; attempt++) {
        try {
          const response = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(payload) });
          const resData = await response.json();
          
          if (resData.authError) {
            clearAuthStorage();
            alert("セッションの有効期限が切れました。再ログインしてください。");
            location.reload();
            throw new Error("Auth Error");
          }
          
          if (!resData.success) {
            throw new Error(resData.error || "処理に失敗しました");
          }
          
          localStorage.setItem("admin_last_auth_time", Date.now().toString());
          return resData;
        } catch (error) {
          if (error.message === "Auth Error") throw error;

          if (attempt < retries) {
            console.warn(`通信失敗 (${attempt}/${retries}回目): ${error.message}。${interval}ms後に再試行します...`);
            await new Promise(resolve => setTimeout(resolve, interval));
          } else {
            console.error(`最大リトライ回数(${retries}回)に達したため失敗しました:`, error);
            throw error;
          }
        }
      }
    }

    function initSalaryForm() {
      const monthSelect = document.getElementById("salary-month");
      if (!monthSelect) return;
      monthSelect.innerHTML = "";
      
      const now = new Date();
      for (let i = -4; i <= 1; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        const mStr = m < 10 ? "0" + m : m;
        const val = `${y}/${mStr}`;
        
        const prevD = new Date(y, d.getMonth() - 1, 1);
        const prevM = prevD.getMonth() + 1;
        const text = `${y}年${m}月度 (${prevM}/16 ～ ${m}/15)`;
        
        const opt = document.createElement("option");
        opt.value = val;
        opt.innerText = text;
        monthSelect.appendChild(opt);
      }
  
      let currentMonthString = now.getFullYear() + "/" + ((now.getMonth() + 1) < 10 ? "0" + (now.getMonth() + 1) : (now.getMonth() + 1));
      if (now.getDate() < 16) {
        const prevM = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        currentMonthString = prevM.getFullYear() + "/" + ((prevM.getMonth() + 1) < 10 ? "0" + (prevM.getMonth() + 1) : (prevM.getMonth() + 1));
      }
      monthSelect.value = currentMonthString;
      
      rebuildSalaryStoreSelect(document.getElementById("salary-store"));
    }
  
    function rebuildSalaryStoreSelect(storeSelect) {
      if (!storeSelect) return;
      storeSelect.innerHTML = '<option value="">-- 店舗を選択してください（必須） --</option>';
      
      globalStoreList.forEach(item => {
        if (item.storeName) {
          const opt = document.createElement("option");
          opt.value = item.storeName;
          opt.innerText = item.storeName;
          storeSelect.appendChild(opt);
        }
      });
      storeSelect.onchange = updateSalaryNameSelect;
    }
  
    async function updateSalaryNameSelect() {
      const storeSelect = document.getElementById("salary-store");
      const nameSelect = document.getElementById("salary-name");
      const resultArea = document.getElementById("salary-result-area");
      const monthSelect = document.getElementById("salary-month");
      const fetchBtn = document.getElementById("btn-fetch");
      const payslipBtn = document.getElementById("btn-payslip");
      
      if (!storeSelect || !nameSelect) return;
      
      const selectedStore = storeSelect.value;
      const selectedMonth = monthSelect ? monthSelect.value : "";
      
      nameSelect.innerHTML = '<option value="ALL">すべてのスタッフ (店舗全員)</option>';
      
      if (!selectedStore) {
        if (resultArea) {
          resultArea.innerHTML = '<div class="text-center text-muted p-4">勤怠データを取得すると、ここに給与計算対象の一覧が表示されます。</div>';
        }
        return;
      }
    
      storeSelect.disabled = true;
      if (monthSelect) monthSelect.disabled = true;
      nameSelect.disabled = true;
      if (fetchBtn) fetchBtn.disabled = true;
      if (payslipBtn) payslipBtn.disabled = true;
    
      if (resultArea) {
        resultArea.innerHTML = `
          <div class="text-center p-5 text-primary">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <div class="font-weight-bold">🔄 スタッフマスタ整合性・同期状況を確認中...</div>
            <small class="text-muted">タイムカードおよび給与マスタ情報を照合しています。</small>
          </div>
        `;
      }
    
      try {
        const checkRes = await callGas("checkStaffMasterConsistency", {
          store: selectedStore,
          month: selectedMonth
        });
    
        if (!checkRes || !checkRes.success) {
          const errorMsg = (checkRes && checkRes.error) 
            ? checkRes.error 
            : "スタッフマスタ整合性チェックでエラーが発生しました。";
    
          alert(errorMsg);
          storeSelect.value = "";
    
          if (resultArea) {
            resultArea.innerHTML = `<div class="alert alert-danger font-weight-bold m-3">${errorMsg.replace(/\n/g, '<br>')}</div>` +
              '<div class="text-center text-muted p-3">店舗を正しく選択し直すか、スタッフマスタを確認してください。</div>';
          }
    
          storeSelect.disabled = false;
          if (monthSelect) monthSelect.disabled = false;
          nameSelect.disabled = false;
          if (fetchBtn) fetchBtn.disabled = false;
          if (payslipBtn) payslipBtn.disabled = false;
    
          return;
        }
    
        const validStaffs = checkRes.validStaffs || [];
        let existingStaffs = [];
        const statusRes = await callGas("checkSalaryStatus", { month: selectedMonth, store: selectedStore });
        if (statusRes && statusRes.success) {
          existingStaffs = statusRes.existingStaffs || [];
        }
    
        let staffRows = "";
        validStaffs.forEach(staffName => {
          const opt = document.createElement("option");
          opt.value = staffName;
          opt.innerText = staffName;
          nameSelect.appendChild(opt);
    
          const staffStatusObj = existingStaffs.find(s => s.name === staffName);
          const currentStatus = staffStatusObj ? staffStatusObj.status : "勤怠データ未取得";
          const updatedAtStr = (staffStatusObj && staffStatusObj.updatedAt) ? staffStatusObj.updatedAt : "-";
          const badgeClass = getStatusBadgeClass(currentStatus);
          const safeStaffId = encodeURIComponent(staffName);
    
          const cacheKey = `${selectedStore}_${staffName}`;
          globalAlertLogs[cacheKey] = (staffStatusObj && staffStatusObj.checkAlerts) ? staffStatusObj.checkAlerts : [];
    
          let badgeOnClickAttr = "";
          if (currentStatus === "勤怠データエラー" || currentStatus === "勤怠データワーニング") {
            badgeOnClickAttr = `onclick="showAttendanceAlertDetails('${selectedStore}', '${staffName}')" style="cursor: pointer;"`;
          }
    
          staffRows += `
            <tr id="row-${selectedStore}-${safeStaffId}">
              <td>${selectedMonth}月度</td>
              <td class="font-weight-bold">${staffName}</td>
              <td><span class="${badgeClass}" ${badgeOnClickAttr}>${currentStatus}</span></td>
              <td class="text-muted status-updated-at" style="font-size: 0.85rem;">${updatedAtStr}</td>
            </tr>`;
        });
    
        storeSelect.disabled = false;
        if (monthSelect) monthSelect.disabled = false;
        nameSelect.disabled = false;
        if (fetchBtn) fetchBtn.disabled = false;
        if (payslipBtn) payslipBtn.disabled = false;
    
        if (resultArea) {
          resultArea.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="font-weight-bold m-0 text-primary">📊 勤怠データ同期状況（${selectedStore}）</h6>
              <small class="text-muted">リアルタイム同期中</small>
            </div>
            <div class="table-responsive">
              <table class="table table-bordered table-hover m-0 bg-white" style="font-size: 0.9rem;">
                <thead class="thead-light">
                  <tr>
                    <th>対象月度</th>
                    <th>スタッフ名</th>
                    <th>ステータス</th>
                    <th>最終更新日時</th>
                  </tr>
                </thead>
                <tbody>
                  ${staffRows ? staffRows : '<tr><td colspan="4" class="text-center text-muted">この条件（店舗・在籍期間）に一致するスタッフがいません。</td></tr>'}
                </tbody>
              </table>
            </div>
          `;
        }
    
      } catch (e) {
        alert("通信エラーが発生しました: " + e.message);
        
        if (resultArea) {
          resultArea.innerHTML = `<div class="alert alert-danger font-weight-bold">通信エラー: ${e.message}</div>`;
        }
        storeSelect.disabled = false;
        if (monthSelect) monthSelect.disabled = false;
        nameSelect.disabled = false;
        if (fetchBtn) fetchBtn.disabled = false;
        if (payslipBtn) payslipBtn.disabled = false;
      }
    }  
    
    async function fetchAttendanceForSalary() {
      const month = document.getElementById("salary-month").value;
      const store = document.getElementById("salary-store").value;
      const name = document.getElementById("salary-name").value;
    
      if (!month) { alert("対象月度を選択してください。"); return; }
      if (!store) { alert("店舗名を選択してください。"); return; }
    
      let targets = [];
      if (name === "ALL") {
        globalStaffList.forEach(staff => {
          if (!staff.stores) return;
          const belongStores = staff.stores.split(',').map(s => s.trim());
          if (belongStores.includes(store)) {
            targets.push(staff.name);
          }
        });
      } else {
        targets.push(name);
      }
    
      if (targets.length === 0) {
        alert("処理対象のスタッフが見つかりません。");
        return;
      }
    
      const totalCount = targets.length;
      let successCount = 0;
      let errorMessages = [];
    
      showLoading(true);
      updateProgressMessage(0, totalCount, "勤怠同期");
    
      for (let i = 0; i < targets.length; i++) {
        const staffName = targets[i];
        updateProgressMessage(i, totalCount, "勤怠同期", staffName);
    
        try {
          const res = await callGas("getAttendanceDataForSalary", {
            salarySpreadsheetId: SALARY_SPREADSHEET_ID,
            month: month,
            store: store,
            name: staffName
          });
    
          if (res && res.success) {
            successCount++;
            const safeStaffId = encodeURIComponent(staffName);
            const row = document.getElementById(`row-${store}-${safeStaffId}`);
            
            let returnedStatus = "勤怠データ取得済";
            let checkAlerts = [];
    
            if (res.data && res.data.length > 0) {
              const matched = res.data.find(item => item.name === staffName);
              if (matched) {
                if (matched.status) returnedStatus = matched.status;
                if (matched.checkAlerts) checkAlerts = matched.checkAlerts;
              }
            }
    
            const cacheKey = `${store}_${staffName}`;
            globalAlertLogs[cacheKey] = checkAlerts;
    
            if (row) {
              const badge = row.querySelector('.status-badge');
    
              if (badge) {
                badge.className = getStatusBadgeClass(returnedStatus);
                badge.innerText = returnedStatus;
    
                if (returnedStatus === "勤怠データエラー" || returnedStatus === "勤怠データワーニング") {
                  badge.setAttribute("onclick", `showAttendanceAlertDetails('${store}', '${staffName}')`);
                  badge.style.cursor = "pointer";
                } else {
                  badge.removeAttribute("onclick");
                  badge.style.cursor = "default";
                }
              }
    
              const updatedAtCell = row.querySelector('.status-updated-at');
              if (updatedAtCell) {
                const now = new Date();
                const nowStr = now.getFullYear() + "/" + 
                  ("0" + (now.getMonth() + 1)).slice(-2) + "/" + 
                  ("0" + now.getDate()).slice(-2) + " " + 
                  ("0" + now.getHours()).slice(-2) + ":" + 
                  ("0" + now.getMinutes()).slice(-2) + ":" + 
                  ("0" + now.getSeconds()).slice(-2);
                updatedAtCell.innerText = nowStr;
              }
            }
          } else {
            errorMessages.push(`【${staffName}】 ${res.error || "失敗しました"}`);
          }
        } catch (e) {
          errorMessages.push(`【${staffName}】 通信エラーが発生しました (${e.message})`);
        }
    
        await new Promise(resolve => setTimeout(resolve, 200));
      }
    
      showLoading(false);
    
      if (errorMessages.length === 0) {
        alert(`同期処理がすべて完了しました！\n（成功: ${successCount} 件 / 全: ${totalCount} 件）`);
      } else {
        alert(`一部のデータ取得でエラーが発生しました。\n\n成功: ${successCount} 件 / 失敗: ${errorMessages.length} 件\n\n▼エラー詳細:\n${errorMessages.join("\n")}`);
      }
    }

    async function generateStaffPayslips() {
      const month = document.getElementById("salary-month").value;
      const store = document.getElementById("salary-store").value;
      const name = document.getElementById("salary-name").value;

      if (!month) { alert("対象月度を選択してください。"); return; }
      if (!store) { alert("店舗名を選択してください。"); return; }

      let targets = [];
      if (name === "ALL") {
        globalStaffList.forEach(staff => {
          if (!staff.stores) return;
          const belongStores = staff.stores.split(',').map(s => s.trim());
          if (belongStores.includes(store)) {
            targets.push(staff.name);
          }
        });
      } else {
        targets.push(name);
      }

      if (targets.length === 0) {
        alert("処理対象のスタッフが見つかりません。");
        return;
      }

      if (!confirm(`選択された月度・店舗のスタッフ（全 ${targets.length} 件）の給与明細シートの生成を開始します。よろしいですか？\n※事前に「勤怠データ取得」を完了させておいてください。`)) {
        return;
      }

      const totalCount = targets.length;
      let successCount = 0;
      let errorMessages = [];

      showLoading(true);
      updateProgressMessage(0, totalCount, "明細作成");

      for (let i = 0; i < targets.length; i++) {
        const staffName = targets[i];
        updateProgressMessage(i, totalCount, "明細作成", staffName);

        try {
          const res = await callGas("createStaffPayslip", {
            month: month,
            store: store,
            name: staffName
          });

          if (res && res.success) {
            const resObj = res.data || res;
            
            const isSkipped = resObj.skipped === true || 
                              (resObj.message && String(resObj.message).indexOf("スキップ") !== -1) ||
                              (res.message && String(res.message).indexOf("スキップ") !== -1);

            if (isSkipped) {
              console.log(`${staffName} さんはスキップされたため、画面表示を保持します。`);
            } else {
              successCount++;
              const safeStaffId = encodeURIComponent(staffName);
              const row = document.getElementById(`row-${store}-${safeStaffId}`);
              if (row) {
                const badge = row.querySelector('.status-badge');
                if (badge) {
                  badge.className = "badge badge-primary status-badge";
                  badge.innerText = "給与明細作成済";
                }
                const updatedAtCell = row.querySelector('.status-updated-at');
                if (updatedAtCell) {
                  const now = new Date();
                  const nowStr = now.getFullYear() + "/" + 
                    ("0" + (now.getMonth() + 1)).slice(-2) + "/" + 
                    ("0" + now.getDate()).slice(-2) + " " + 
                    ("0" + now.getHours()).slice(-2) + ":" + 
                    ("0" + now.getMinutes()).slice(-2) + ":" + 
                    ("0" + now.getSeconds()).slice(-2);
                  updatedAtCell.innerText = nowStr;
                }
              }
            }
          } else {
            errorMessages.push(`【${staffName}】 ${res.error || "失敗しました"}`);
          }
        } catch (e) {
          errorMessages.push(`【${staffName}】 通信エラーが発生しました (${e.message})`);
        }

        await new Promise(resolve => setTimeout(resolve, 200));
      }

      showLoading(false);

      if (errorMessages.length === 0) {
        alert(`給与明細の作成処理がすべて完了しました！\n（成功: ${successCount} 件 / 全: ${totalCount} 件）`);
      } else {
        alert(`一部の明細作成でエラーが発生しました。\n\n成功: ${successCount} 件 / 失敗: ${errorMessages.length} 件\n\n▼エラー詳細:\n${errorMessages.join("\n")}`);
      }
    }

    function updateProgressMessage(current, total, taskType = "処理", activeName = "") {
      const loadingEl = document.getElementById('loading');
      if (!loadingEl) return;
      
      let msg = `🔄 ${taskType}中... (${current} / ${total} 件完了)`;
      if (activeName) {
        msg += `<br><span style="font-size: 0.9rem; color: #555; font-weight: normal;">現在: ${activeName} さんのデータを処理中...</span>`;
      }
      loadingEl.innerHTML = msg;
    }
    
    async function loadStaffList() {
      try {
        const res = await callGas("getStaffList");
        globalStaffList = res.data || [];
      } catch(e) { console.error("スタッフマスタの同期に失敗しました", e); }
    }
  
    async function loadStoreList() {
      try {
        const res = await callGas("getStoreList");
        globalStoreList = res.data || [];
      } catch(e) { console.error("店舗マスタの同期に失敗しました", e); }
    }

    async function handleCreateSummaryList() {
      const storeSelect = document.getElementById("salary-store");
      const monthSelect = document.getElementById("salary-month");
      const nameSelect = document.getElementById("salary-name");
      const fetchBtn = document.getElementById("btn-fetch");
      const payslipBtn = document.getElementById("btn-payslip");
      const summaryBtn = document.getElementById("btn-summary");
      const resultArea = document.getElementById("salary-result-area");
    
      const selectedStore = storeSelect ? storeSelect.value : "";
      const selectedMonth = monthSelect ? monthSelect.value : "";
    
      if (!selectedStore) {
        alert("対象店舗を選択してください。");
        return;
      }
    
      if (!confirm(`${selectedMonth}月度 [${selectedStore}] の「給与明細一覧」シートを作成しますか？`)) {
        return;
      }
    
      if (storeSelect) storeSelect.disabled = true;
      if (monthSelect) monthSelect.disabled = true;
      if (nameSelect) nameSelect.disabled = true;
      if (fetchBtn) fetchBtn.disabled = true;
      if (payslipBtn) payslipBtn.disabled = true;
      if (summaryBtn) summaryBtn.disabled = true;
    
      if (resultArea) {
        resultArea.innerHTML = `
          <div class="text-center p-5 bg-light rounded shadow-sm">
            <div class="spinner-border text-info mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
            <h5 class="font-weight-bold text-info">⏳ 給与明細一覧シートを作成中...</h5>
            <p class="text-muted m-0">データを集計・書き込みしています。完了するまでそのままお待ちください。</p>
          </div>
        `;
      }
    
      try {
        const res = await callGas("createSalarySummaryList", {
          month: selectedMonth,
          store: selectedStore,
          salarySpreadsheetId: typeof SALARY_SPREADSHEET_ID !== "undefined" ? SALARY_SPREADSHEET_ID : ""
        });
    
        if (res && res.success) {
          alert("✅ " + res.message);
          if (resultArea) {
            resultArea.innerHTML = `<div class="alert alert-success font-weight-bold p-3">${res.message}</div>`;
          }
        } else {
          alert("❌ 作成エラー: " + (res.error || "処理に失敗しました。"));
          if (resultArea) {
            resultArea.innerHTML = `<div class="alert alert-danger font-weight-bold p-3">${res.error}</div>`;
          }
        }
      } catch (e) {
        alert("通信エラーが発生しました: " + e.message);
        if (resultArea) {
          resultArea.innerHTML = `<div class="alert alert-danger font-weight-bold p-3">通信エラー: ${e.message}</div>`;
        }
      } finally {
        if (storeSelect) storeSelect.disabled = false;
        if (monthSelect) monthSelect.disabled = false;
        if (nameSelect) nameSelect.disabled = false;
        if (fetchBtn) fetchBtn.disabled = false;
        if (payslipBtn) payslipBtn.disabled = false;
        if (summaryBtn) summaryBtn.disabled = false;
      }
    }
    
    async function initTransferForm() {
      const transferMonthSelect = document.getElementById("transfer-month");
      const salaryMonthSelect = document.getElementById("salary-month");
      const methodSelect = document.getElementById("transfer-method-filter");

      if (!transferMonthSelect) {
        console.warn("transfer-month エレメントが見つかりません。");
        return;
      }

      if (salaryMonthSelect && salaryMonthSelect.options.length > 0) {
        transferMonthSelect.innerHTML = salaryMonthSelect.innerHTML;
        transferMonthSelect.value = salaryMonthSelect.value;
      } else {
        transferMonthSelect.innerHTML = "";
        const now = new Date();
        for (let i = -4; i <= 1; i++) {
          const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
          const y = d.getFullYear();
          const m = d.getMonth() + 1;
          const mStr = m < 10 ? "0" + m : m;
          const val = `${y}/${mStr}`;

          const prevD = new Date(y, d.getMonth() - 1, 1);
          const prevM = prevD.getMonth() + 1;
          const text = `${y}年${m}月度 (${prevM}/16 ～ ${m}/15)`;

          const opt = document.createElement("option");
          opt.value = val;
          opt.innerText = text;
          transferMonthSelect.appendChild(opt);
        }

        let currentMonthString = now.getFullYear() + "/" + ((now.getMonth() + 1) < 10 ? "0" + (now.getMonth() + 1) : (now.getMonth() + 1));
        if (now.getDate() < 16) {
          const prevM = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          currentMonthString = prevM.getFullYear() + "/" + ((prevM.getMonth() + 1) < 10 ? "0" + (prevM.getMonth() + 1) : (prevM.getMonth() + 1));
        }
        transferMonthSelect.value = currentMonthString;
      }

      if (methodSelect) {
        methodSelect.removeEventListener("change", loadTransferStaffList);
        methodSelect.addEventListener("change", loadTransferStaffList);
      }

      await loadCompanyList();
    }

    async function loadCompanyList() {
      const companySelect = document.getElementById("transfer-company");
      if (!companySelect) return;

      try {
        const res = await callGas("getCompanyList");
        if (res && res.success) {
          companySelect.innerHTML = '<option value="">-- 会社を選択してください --</option>';
          (res.data || []).forEach(company => {
            const opt = document.createElement("option");
            opt.value = company;
            opt.innerText = company;
            companySelect.appendChild(opt);
          });
        }
      } catch (e) {
        console.error("会社マスタの取得に失敗しました", e);
      }
    }

    async function loadTransferStaffList() {
      const monthSelect = document.getElementById("transfer-month");
      const companySelect = document.getElementById("transfer-company");
      const methodSelect = document.getElementById("transfer-method-filter");
      const resultArea = document.getElementById("salary-transfer-result-area") || document.getElementById("transfer-result-area");

      const month = monthSelect ? monthSelect.value : "";
      const company = companySelect ? companySelect.value : "";
      const filterMethod = methodSelect ? methodSelect.value : "銀行振込";

      if (!month || !company) {
        if (resultArea) {
          resultArea.innerHTML = '<div class="text-center text-muted p-4">対象月度および会社名を選択すると、ここにスタッフ一覧・振込金額が表示されます。</div>';
        }
        return;
      }

      if (resultArea) {
        resultArea.innerHTML = `
          <div class="text-center p-4 text-primary">
            <div class="spinner-border text-primary mb-2" role="status"></div>
            <div class="font-weight-bold">🔄 振込対象スタッフデータを取得中...</div>
          </div>`;
      }

      try {
        const res = await callGas("getTransferStaffList", { month: month, company: company });

        if (!res || !res.success) {
          if (resultArea) {
            resultArea.innerHTML = `<div class="alert alert-danger m-3">${res.error || "データの取得に失敗しました。"}</div>`;
          }
          return;
        }

        const rawStaffList = res.data || [];
        
        const staffList = rawStaffList.filter(item => {
          if (!filterMethod || filterMethod === "ALL") return true;
          return item.method === filterMethod;
        });

        if (staffList.length === 0) {
          if (resultArea) {
            resultArea.innerHTML = `
              <div class="p-3 bg-light rounded border mb-3">
                <div class="form-row align-items-center">
                  <div class="col-auto">
                    <label class="col-form-label font-weight-bold text-secondary">支給方法絞り込み:</label>
                  </div>
                  <div class="col-auto">
                    <select id="transfer-method-filter" class="form-control form-control-sm" onchange="loadTransferStaffList()">
                      <option value="銀行振込" ${filterMethod === '銀行振込' ? 'selected' : ''}>銀行振込</option>
                      <option value="現金" ${filterMethod === '現金' ? 'selected' : ''}>現金</option>
                      <option value="ALL" ${filterMethod === 'ALL' ? 'selected' : ''}>すべて表示</option>
                    </select>
                  </div>
                  <div class="col-auto ml-2">
                    <button type="button" class="btn btn-success btn-sm font-weight-bold" onclick="generateZenginFile()">
                      📄 全銀振込データ出力 (.txt)
                    </button>
                    <button type="button" class="btn btn-primary btn-sm font-weight-bold ml-1" onclick="generateReceiptFile()">
                      📝 給与受領書作成
                    </button>
                  </div>
                </div>
              </div>
              <div class="text-center text-muted p-4">該当する振込対象スタッフが見つかりませんでした。</div>`;
          }
          return;
        }

        let totalAmount = 0;
        let rowsHtml = "";

        staffList.forEach(item => {
          const rawNum = typeof item.amount === 'number' ? item.amount : parseFloat(String(item.amount).replace(/[^0-9.-]+/g, "")) || 0;
          totalAmount += rawNum;

          const formattedAmount = "￥" + rawNum.toLocaleString();

          rowsHtml += `
            <tr>
              <td class="font-weight-bold">${item.name}</td>
              <td>${item.storeName || "-"}</td>
              <td class="text-right font-weight-bold text-success">${formattedAmount}</td>
              <td class="text-center">${item.method || "-"}</td>
            </tr>`;
        });

        if (resultArea) {
          resultArea.innerHTML = `
            <!-- 絞り込みコントロール & 合計表示エリア -->
            <div class="card bg-light mb-3 border-secondary">
              <div class="card-body p-3">
                <div class="row align-items-center">
                  <div class="col-md-7 d-flex align-items-center mb-2 mb-md-0">
                    <label for="transfer-method-filter" class="font-weight-bold mr-2 m-0 text-dark" style="white-space: nowrap;">支給方法絞り込み:</label>
                    <select id="transfer-method-filter" class="form-control form-control-sm w-auto mr-3" onchange="loadTransferStaffList()">
                      <option value="銀行振込" ${filterMethod === '銀行振込' ? 'selected' : ''}>銀行振込</option>
                      <option value="現金" ${filterMethod === '現金' ? 'selected' : ''}>現金</option>
                      <option value="ALL" ${filterMethod === 'ALL' ? 'selected' : ''}>すべて表示</option>
                    </select>
                    <!-- 移動・新規追加された操作ボタンエリア -->
                    <button type="button" class="btn btn-success btn-sm font-weight-bold mr-2" onclick="generateZenginFile()">
                      📄 全銀振込データ出力 (.txt)
                    </button>
                    <button type="button" class="btn btn-primary btn-sm font-weight-bold" onclick="generateReceiptFile()">
                      📝 給与受領書作成
                    </button>
                  </div>
                  <div class="col-md-5 text-md-right">
                    <span class="h6 font-weight-bold text-dark mr-2">合計支給金額:</span>
                    <span class="h4 font-weight-bold text-primary mb-0">￥${totalAmount.toLocaleString()}</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- テーブル領域 -->
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="font-weight-bold m-0 text-primary">👥 振込対象スタッフ一覧（${company} / ${month}月度）</h6>
              <small class="text-muted">該当件数: ${staffList.length} 件</small>
            </div>
            <div class="table-responsive">
              <table class="table table-bordered table-hover m-0 bg-white" style="font-size: 0.9rem;">
                <thead class="thead-light">
                  <tr>
                    <th>氏名</th>
                    <th>店舗</th>
                    <th class="text-right">支給金額</th>
                    <th class="text-center">支給方法</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>`;
        }

      } catch (e) {
        if (resultArea) {
          resultArea.innerHTML = `<div class="alert alert-danger font-weight-bold p-3">通信エラー: ${e.message}</div>`;
        }
      }
    }

    async function generateZenginFile() {
      console.log('=== 全銀データ作成処理を開始します ===');

      const dateInput = document.getElementById('transfer-date');
      if (!dateInput || !dateInput.value) {
        alert('振込指定日を選択してください。');
        return;
      }

      const dateParts = dateInput.value.split('-');
      if (dateParts.length !== 3) {
        alert('振込指定日の形式が正しくありません。');
        return;
      }
      const transferDateMMDD = dateParts[1] + dateParts[2];

      const companyVal = document.getElementById('transfer-company')?.value || '';
      const monthVal = document.getElementById('transfer-month')?.value || '';

      if (!companyVal || !monthVal) {
        alert('会社名および対象月度を選択してください。');
        return;
      }

      try {
        console.log('リクエスト送信中...', { companyName: companyVal, targetMonth: monthVal, transferDate: transferDateMMDD });

        const result = await callGas("createZenginData", {
          companyName: companyVal,
          targetMonth: monthVal,
          transferDate: transferDateMMDD
        });

        console.log('GAS返却結果:', result);

        if (result && (result.status === 'success' || result.success)) {
          downloadTextFile(result.fileName || '全銀振込データ.txt', result.textData || result.data);
        } else {
          const errorMsg = (result && (result.message || result.error)) ? (result.message || result.error) : 'データの生成に失敗しました。';
          alert('エラー: ' + errorMsg);
        }

      } catch (error) {
        console.error('通信例外エラー:', error);
        alert('通信エラーが発生しました: ' + error.message);
      }
    }

    // ★ 給与受領書作成実行関数（新規追加）
    async function generateReceiptFile() {
      const companyVal = document.getElementById('transfer-company')?.value || '';
      const monthVal = document.getElementById('transfer-month')?.value || '';

      if (!companyVal || !monthVal) {
        alert('会社名および対象月度を選択してください。');
        return;
      }

      if (!confirm(`${monthVal}月度 [${companyVal}] の現金支給スタッフ向け給与受領書を作成しますか？`)) {
        return;
      }

      showLoading(true);

      try {
        const res = await callGas("createSalaryReceipt", {
          month: monthVal,
          company: companyVal
        });

        showLoading(false);

        if (res && res.success) {
          alert("✅ " + res.message);
        } else {
          alert("❌ 作成エラー: " + (res.error || "処理に失敗しました。"));
        }
      } catch (e) {
        showLoading(false);
        alert("通信エラーが発生しました: " + e.message);
      }
    }

    function downloadTextFile(fileName, textData) {
      const blob = new Blob([textData], { type: 'text/plain;charset=shift_jis;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
