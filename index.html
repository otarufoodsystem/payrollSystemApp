<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>給与管理システム</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body { background-color: #f4f6f9; font-family: 'Helvetica Neue', Arial, sans-serif; }
    .navbar { background-color: #343a40; color: #fff; }
    .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; }
    .tab-btn { padding: 10px 20px; font-weight: bold; border: none; background: none; color: #6c757d; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #007bff; border-bottom: 3px solid #007bff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; color: #007bff; text-align: center; }
    #protection-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9990; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
  </style>
</head>
<body oninput="handleUserActivity()" onclick="handleUserActivity()" onkeypress="handleUserActivity()">

  <div id="loading" style="display: none;">🔄 処理中...</div>

  <div id="protection-overlay" style="display: none;">認証を確認しています...</div>

  <div id="login-screen" class="container mt-5" style="display: none; max-width: 400px;">
    <div class="card p-4">
      <h3 class="text-center mb-4">給与管理システム</h3>
      <div id="login-err-msg" class="alert alert-danger" style="display: none;">ユーザー名またはパスワードが違います</div>
      <div class="form-group">
        <label for="login-user">ユーザー名</label>
        <input type="text" id="login-user" class="form-control">
      </div>
      <div class="form-group">
        <label for="login-pass">パスワード</label>
        <input type="password" id="login-pass" class="form-control">
      </div>
      <button class="btn btn-primary btn-block font-weight-bold" onclick="executeManualLogin()">ログイン</button>
      <div class="text-center mt-3 text-muted" style="font-size: 0.8rem;">Version: <span id="app-version">-</span></div>
    </div>
  </div>

  <div id="main-app" class="container-fluid mt-3" style="display: none;">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded">
      <span class="navbar-brand font-weight-bold">💰 給与管理システム</span>
      <div class="ml-auto text-white-50 mr-3" style="font-size: 0.9rem;">
        ユーザー: <span id="current-user-display" class="text-white font-weight-bold"></span>
      </div>
      <button class="btn btn-outline-light btn-sm" onclick="triggerTimeout()">ログアウト</button>
    </nav>

    <div class="d-flex border-bottom mb-4 bg-white rounded p-1 shadow-sm">
      <button id="tab-salary-btn" class="tab-btn active" onclick="switchTab('salary')">💰 給与計算メニュー</button>
    </div>

    <div id="tab-salary" class="tab-content active">
      <div class="card p-4 mb-4">
        <h5 class="font-weight-bold mb-3">勤怠データの呼び出し・給与計算</h5>
        <div class="form-row align-items-end">
          
          <div class="col-md-2 mb-3">
            <label for="salary-month" class="font-weight-bold">対象月度 <span class="text-danger">*</span></label>
            <select id="salary-month" class="form-control"></select>
          </div>
          
          <div class="col-md-3 mb-3">
            <label for="salary-store" class="font-weight-bold">対象店舗 <span class="text-danger">*</span></label>
            <select id="salary-store" class="form-control">
              <option value="">-- 店舗を選択してください（必須） --</option>
            </select>
          </div>
          
          <div class="col-md-3 mb-3">
            <label for="salary-name" class="font-weight-bold">個人名（任意）</label>
            <select id="salary-name" class="form-control">
              <option value="ALL">すべてのスタッフ (店舗全員)</option>
            </select>
          </div>
          
          <div class="col-md-2 mb-3">
            <button type="button" id="btn-fetch" class="btn btn-primary btn-block font-weight-bold" onclick="fetchAttendanceForSalary()">
              🔄 勤怠データ取得
            </button>
          </div>

          <div class="col-md-2 mb-3">
            <button type="button" id="btn-payslip" class="btn btn-success btn-block font-weight-bold" onclick="generateStaffPayslips()">
              📄 給与明細作成
            </button>
          </div>
          
        </div>
      </div>

      <div id="salary-result-area" class="card p-4">
        <div class="text-center text-muted">
          勤怠データを取得すると、ここに給与計算対象の一覧が表示されます。
        </div>
      </div>
    </div>
  </div>

  <script>
    // ------------------------------------------------------------
    // ⚙️ 環境設定・定数
    // ------------------------------------------------------------
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzgrOh7Dl5iZLiYqQc8HMcM-y83pvSLW8fcxFB7_cSyIMv_JquCR0DDlGjecCK8L_0/exec";
    const APP_VERSION = "1.2.18";
    const TEN_MINUTES = 10 * 60 * 1000;
    const SALARY_SPREADSHEET_ID = "1_BACpUP-ReKQQV2ywDm7nvU25Y8eYxrPfYLW8xxfd60"; 

    let currentUsername = "";
    let currentPassword = "";
    let timeoutTimer = null;
    let globalStaffList = [];
    let globalStoreList = [];

    const lastAuthTime = localStorage.getItem("admin_last_auth_time") || "0";
    window.addEventListener("DOMContentLoaded", runAuthentication);

    // ------------------------------------------------------------
    // 🔒 認証・セキュリティ周り
    // ------------------------------------------------------------
    async function runAuthentication() {
      if (document.getElementById("app-version")) document.getElementById("app-version").innerText = APP_VERSION;

      const overlay = document.getElementById("protection-overlay");
      const loginScreen = document.getElementById("login-screen");
      const mainApp = document.getElementById("main-app");
      const now = Date.now();
  
      if (now - parseInt(lastAuthTime, 10) > TEN_MINUTES) {
        clearAuthStorage();
      }
      
      const savedUser = localStorage.getItem("admin_saved_username") || "";
      const savedPass = localStorage.getItem("admin_saved_password") || "";
      
      if (savedUser && savedPass) {
        if (loginScreen) loginScreen.style.display = "none";
        if (overlay) overlay.style.display = "flex";
        
        showLoading(true);
        try {
          const response = await fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "checkAuth", username: savedUser, password: savedPass, appVersion: APP_VERSION })
          });
          const resData = await response.json(); 
          if (resData.success) {
            currentUsername = savedUser;
            currentPassword = savedPass;
            localStorage.setItem("admin_last_auth_time", Date.now().toString());
            document.getElementById("current-user-display").innerText = currentUsername;
            
            await loadStoreList();
            await loadStaffList();
            
            if (overlay) overlay.style.display = "none";
            if (mainApp) mainApp.style.display = "block";
            
            initSalaryForm();
            showLoading(false);
            resetTimeoutTimer();
            return;
          } else {
            alert("【認証不承認】保存されたパスワードが違います。ストレージをクリアします。理由: " + resData.error);
            clearAuthStorage();
          }
        } catch (e) {
          if (overlay) overlay.innerText = "通信エラーが発生しました。リロードしてください。";
          showLoading(false);
          return;
        }
      }
  
      if (overlay) overlay.style.display = "none";
      if (loginScreen) loginScreen.style.display = "flex";
      if (mainApp) mainApp.style.display = "none";
      showLoading(false);
    }

    async function executeManualLogin() {
      const user = document.getElementById("login-user").value.trim();
      const pass = document.getElementById("login-pass").value.trim();
      if(!user || !pass) { alert("ユーザー名とパスワードを入力してください。"); return; }

      showLoading(true);
      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "checkAuth", username: user, password: pass, appVersion: APP_VERSION })
        });
        const resData = await response.json();
        showLoading(false);
        if(resData.success) {
          localStorage.setItem("admin_saved_username", user);
          localStorage.setItem("admin_saved_password", pass);
          localStorage.setItem("admin_last_auth_time", Date.now().toString());
          document.getElementById("login-err-msg").style.display = "none";
          location.reload();
        } else {
          alert("【手動ログイン失敗】理由: " + (resData.error || "ユーザー名またはパスワードが違います。"));
          document.getElementById("login-err-msg").style.display = "block";
        }
      } catch(e) {
        showLoading(false);
        alert("【手動ログイン・通信エラー】\nエラー内容: " + e.message);
      }
    }
  
    function resetTimeoutTimer() {
      if (timeoutTimer) clearTimeout(timeoutTimer);
      if (currentUsername && currentPassword) {
        localStorage.setItem("admin_last_auth_time", Date.now().toString());
        timeoutTimer = setTimeout(triggerTimeout, TEN_MINUTES);
      }
    }
  
    function triggerTimeout() {
      if (timeoutTimer) clearTimeout(timeoutTimer);
      clearAuthStorage();
      currentUsername = "";
      currentPassword = "";
      location.reload();
    }
  
    function clearAuthStorage() {
      localStorage.removeItem("admin_saved_username");
      localStorage.removeItem("admin_saved_password");
      localStorage.removeItem("admin_last_auth_time");
    }

    function handleUserActivity() {
      if (currentUsername && currentPassword) {
        resetTimeoutTimer();
      }
    }
  
    function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }

    function switchTab(type) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if(document.getElementById(`tab-${type}-btn`)) document.getElementById(`tab-${type}-btn`).classList.add('active');
      if(document.getElementById(`tab-${type}`)) document.getElementById(`tab-${type}`).classList.add('active');
    }

    // ------------------------------------------------------------
    // ⚙️ GAS共通呼び出しラッパー (修正版)
    // ------------------------------------------------------------
    async function callGas(action, data = null) {
      const savedUser = localStorage.getItem("admin_saved_username") || "";
      const savedPass = localStorage.getItem("admin_saved_password") || "";
      const payload = { action: action, username: savedUser, password: savedPass };
      if (data !== null) payload.data = data;
  
      try {
        const response = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(payload) });
        const resData = await response.json();
        
        if (resData.authError) {
          clearAuthStorage();
          alert("セッションの有効期限が切れました。再ログインしてください。");
          location.reload();
          throw new Error("Auth Error");
        }
        
        if (!resData.success) {
          throw new Error(resData.error || "処理に失敗しました");
        }
        
        localStorage.setItem("admin_last_auth_time", Date.now().toString());
        return resData;
      } catch (error) {
        alert("通信エラーが発生しました:\n" + error.message);
        showLoading(false);
        throw error;
      }
    }

    // ------------------------------------------------------------
    // 💰 給与計算 UI制御・データ取得
    // ------------------------------------------------------------
    function initSalaryForm() {
      const monthSelect = document.getElementById("salary-month");
      if (!monthSelect) return;
      monthSelect.innerHTML = "";
      
      const now = new Date();
      for (let i = -4; i <= 1; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        const mStr = m < 10 ? "0" + m : m;
        const val = `${y}/${mStr}`;
        
        const prevD = new Date(y, d.getMonth() - 1, 1);
        const prevM = prevD.getMonth() + 1;
        const text = `${y}年${m}月度 (${prevM}/16 ～ ${m}/15)`;
        
        const opt = document.createElement("option");
        opt.value = val;
        opt.innerText = text;
        monthSelect.appendChild(opt);
      }
  
      let currentMonthString = now.getFullYear() + "/" + ((now.getMonth() + 1) < 10 ? "0" + (now.getMonth() + 1) : (now.getMonth() + 1));
      if (now.getDate() < 16) {
        const prevM = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        currentMonthString = prevM.getFullYear() + "/" + ((prevM.getMonth() + 1) < 10 ? "0" + (prevM.getMonth() + 1) : (prevM.getMonth() + 1));
      }
      monthSelect.value = currentMonthString;
      
      rebuildSalaryStoreSelect(document.getElementById("salary-store"));
    }
  
    function rebuildSalaryStoreSelect(storeSelect) {
      if (!storeSelect) return;
      storeSelect.innerHTML = '<option value="">-- 店舗を選択してください（必須） --</option>';
      
      globalStoreList.forEach(item => {
        if (item.storeName) {
          const opt = document.createElement("option");
          opt.value = item.storeName;
          opt.innerText = item.storeName;
          storeSelect.appendChild(opt);
        }
      });
      storeSelect.onchange = updateSalaryNameSelect;
    }
  
    async function updateSalaryNameSelect() {
      const storeSelect = document.getElementById("salary-store");
      const nameSelect = document.getElementById("salary-name");
      const resultArea = document.getElementById("salary-result-area");
      const monthSelect = document.getElementById("salary-month");
      const fetchBtn = document.getElementById("btn-fetch");
      const payslipBtn = document.getElementById("btn-payslip");
      
      if (!storeSelect || !nameSelect) return;
      
      const selectedStore = storeSelect.value;
      const selectedMonth = monthSelect ? monthSelect.value : "";
      
      nameSelect.innerHTML = '<option value="ALL">すべてのスタッフ (店舗全員)</option>';
      
      if (!selectedStore) {
        if (resultArea) {
          resultArea.innerHTML = '<div class="text-center text-muted">勤怠データを取得すると、ここに給与計算対象の一覧が表示されます。</div>';
        }
        return;
      }

      storeSelect.disabled = true;
      if (monthSelect) monthSelect.disabled = true;
      nameSelect.disabled = true;
      if (fetchBtn) fetchBtn.disabled = true;
      if (payslipBtn) payslipBtn.disabled = true;

      if (resultArea) {
        resultArea.innerHTML = `
          <div class="text-center p-5 text-primary">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <div class="font-weight-bold">🔄 現在の同期状況を確認中（処理中...）</div>
            <small class="text-muted">スプレッドシートから最新の情報を読み込んでいます。しばらくお待ちください。</small>
          </div>
        `;
      }

      let existingStaffs = [];
      try {
        const res = await callGas("checkSalaryStatus", { month: selectedMonth, store: selectedStore });
        if (res && res.success) {
          existingStaffs = res.existingStaffs || [];
        }
      } catch (e) {
        console.error("ステータス確認エラー:", e);
      }

      let staffRows = "";
      globalStaffList.forEach(staff => {
        if (!staff.stores) return;
        const belongStores = staff.stores.split(',').map(s => s.trim());
        if (belongStores.includes(selectedStore)) {
          const opt = document.createElement("option");
          opt.value = staff.name;
          opt.innerText = staff.name;
          nameSelect.appendChild(opt);

          const isDownloaded = existingStaffs.includes(staff.name);
          const badgeClass = isDownloaded ? "badge badge-success status-badge" : "badge badge-secondary status-badge";
          const badgeText = isDownloaded ? "取得済" : "未取得";

          staffRows += `
            <tr id="row-${selectedStore}-${staff.name}">
              <td>${selectedMonth}月度</td>
              <td class="font-weight-bold">${staff.name}</td>
              <td><span class="${badgeClass}">${badgeText}</span></td>
            </tr>`;
        }
      });

      storeSelect.disabled = false;
      if (monthSelect) monthSelect.disabled = false;
      nameSelect.disabled = false;
      if (fetchBtn) fetchBtn.disabled = false;
      if (payslipBtn) payslipBtn.disabled = false;

      if (resultArea) {
        resultArea.innerHTML = `
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="font-weight-bold m-0 text-primary">📊 勤怠データ同期状況（${selectedStore}）</h6>
            <small class="text-muted">リアルタイム同期中</small>
          </div>
          <div class="table-responsive">
            <table class="table table-bordered table-hover m-0 bg-white" style="font-size: 0.9rem;">
              <thead class="thead-light">
                <tr>
                  <th>対象月度</th>
                  <th>スタッフ名</th>
                  <th>ステータス</th>
                </tr>
              </thead>
              <tbody>
                ${staffRows ? staffRows : '<tr><td colspan="3" class="text-center text-muted">この店舗に所属するスタッフが登録されていません。</td></tr>'}
              </tbody>
            </table>
          </div>
        `;
      }
    }
  
    async function fetchAttendanceForSalary() {
      const month = document.getElementById("salary-month").value;
      const store = document.getElementById("salary-store").value;
      const name = document.getElementById("salary-name").value;
  
      if (!month) { alert("対象月度を選択してください。"); return; }
      if (!store) { alert("店舗名を選択してください。"); return; }
  
      let targets = [];
      if (name === "ALL") {
        globalStaffList.forEach(staff => {
          if (!staff.stores) return;
          const belongStores = staff.stores.split(',').map(s => s.trim());
          if (belongStores.includes(store)) {
            targets.push(staff.name);
          }
        });
      } else {
        targets.push(name);
      }

      if (targets.length === 0) {
        alert("処理対象のスタッフが見つかりません。");
        return;
      }

      const totalCount = targets.length;
      let successCount = 0;
      let errorMessages = [];

      showLoading(true);
      updateProgressMessage(successCount, totalCount, "勤怠同期");

      for (let i = 0; i < targets.length; i++) {
        const staffName = targets[i];
        updateProgressMessage(successCount, totalCount, "勤怠同期", staffName);

        try {
          const res = await callGas("getAttendanceDataForSalary", {
            salarySpreadsheetId: SALARY_SPREADSHEET_ID,
            month: month,
            store: store,
            name: staffName
          });
    
          if (res && res.success) {
            successCount++;
            const row = document.getElementById(`row-${store}-${staffName}`);
            if (row) {
              const badge = row.querySelector('.status-badge');
              if (badge) {
                badge.className = "badge badge-success status-badge";
                badge.innerText = "取得済";
              }
            }
          } else {
            errorMessages.push(`【${staffName}】 ${res.error || "失敗しました"}`);
          }
        } catch (e) {
          errorMessages.push(`【${staffName}】 通信エラーが発生しました`);
        }
      }

      showLoading(false);

      if (errorMessages.length === 0) {
        alert(`同期処理がすべて完了しました！\n（成功: ${successCount} 件 / 全: ${totalCount} 件）`);
      } else {
        alert(`一部のデータ取得でエラーが発生しました。\n\n成功: ${successCount} 件 / 失敗: ${errorMessages.length} 件\n\n▼エラー詳細:\n${errorMessages.join("\n")}`);
      }
    }

    async function generateStaffPayslips() {
      const month = document.getElementById("salary-month").value;
      const store = document.getElementById("salary-store").value;
      const name = document.getElementById("salary-name").value;

      if (!month) { alert("対象月度を選択してください。"); return; }
      if (!store) { alert("店舗名を選択してください。"); return; }

      let targets = [];
      if (name === "ALL") {
        globalStaffList.forEach(staff => {
          if (!staff.stores) return;
          const belongStores = staff.stores.split(',').map(s => s.trim());
          if (belongStores.includes(store)) {
            targets.push(staff.name);
          }
        });
      } else {
        targets.push(name);
      }

      if (targets.length === 0) {
        alert("処理対象のスタッフが見つかりません。");
        return;
      }

      if (!confirm(`選択された月度・店舗のスタッフ（全 ${targets.length} 件）の給与明細シートの生成を開始します。よろしいですか？\n※事前に「勤怠データ取得」を完了させておいてください。`)) {
        return;
      }

      const totalCount = targets.length;
      let successCount = 0;
      let errorMessages = [];

      showLoading(true);
      updateProgressMessage(successCount, totalCount, "明細作成");

      for (let i = 0; i < targets.length; i++) {
        const staffName = targets[i];
        updateProgressMessage(successCount, totalCount, "明細作成", staffName);

        try {
          const res = await callGas("createStaffPayslip", {
            month: month,
            store: store,
            name: staffName
          });

          if (res && res.success) {
            successCount++;
          } else {
            errorMessages.push(`【${staffName}】 ${res.error || "失敗しました"}`);
          }
        } catch (e) {
          errorMessages.push(`【${staffName}】 通信エラーが発生しました`);
        }
      }

      showLoading(false);

      if (errorMessages.length === 0) {
        alert(`給与明細の作成処理がすべて完了しました！\n（成功: ${successCount} 件 / 全: ${totalCount} 件）`);
      } else {
        alert(`一部の明細作成でエラーが発生しました。\n\n成功: ${successCount} 件 / 失敗: ${errorMessages.length} 件\n\n▼エラー詳細:\n${errorMessages.join("\n")}`);
      }
    }

    function updateProgressMessage(current, total, taskType = "処理", activeName = "") {
      const loadingEl = document.getElementById('loading');
      if (!loadingEl) return;
      
      let msg = `🔄 ${taskType}中... (${current} / ${total} 件完了)`;
      if (activeName) {
        msg += `<br><span style="font-size: 0.9rem; color: #555; font-weight: normal;">現在: ${activeName} さんの明細を出力中...</span>`;
      }
      loadingEl.innerHTML = msg;
    }
    
    async function loadStaffList() {
      try {
        const res = await callGas("getStaffList");
        globalStaffList = res.data || [];
      } catch(e) { console.error("スタッフマスタの同期に失敗しました", e); }
    }
  
    async function loadStoreList() {
      try {
        const res = await callGas("getStoreList");
        globalStoreList = res.data || [];
      } catch(e) { console.error("店舗マスタの同期に失敗しました", e); }
    }
  </script>
</body>
</html>
